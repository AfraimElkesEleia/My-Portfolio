{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Afraim Elkes Eleia — mobile application developer and Computer Engineering graduate from Benha University.">
    <meta name="theme-color" content="#061126">
    <title>{% block title %}Afraim Elkes Eleia | Mobile Application Developer{% endblock %}</title>
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <script src="{% static 'js/site.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="scroll-progress" aria-hidden="true"><span></span></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand" href="#home" aria-label="Afraim Elkes Eleia, home">
            <span class="brand-mark">AE</span>
            <span class="brand-copy">Afraim<br>Eleia</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="#work">Work</a>
            <a href="#about">About</a>
            <a href="#journey">Journey</a>
            <a class="nav-contact" href="#contact">Let's talk <span aria-hidden="true">↗</span></a>
        </nav>
    </header>

    <main id="main-content">{% block content %}{% endblock %}</main>

    <footer>
        <p>© {{ current_year }} Afraim Elkes Eleia</p>
        <p>Mobile application developer</p>
        <a href="#home">Back to top ↑</a>
    </footer>
</body>
</html>
