{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Personal portfolio showcasing projects, skills, and experience.">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'portfolio:home' %}" aria-label="Portfolio home">YN<span>.</span></a>
        <nav aria-label="Main navigation">
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#skills">Skills</a>
            <a class="nav-cta" href="#contact">Contact</a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <p>&copy; {{ current_year }} Your Name. Built with Django.</p>
    </footer>
</body>
</html>
